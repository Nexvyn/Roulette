name: Release

# Builds the Tauri app on macOS, Windows and Linux and attaches the installers to a draft
# GitHub Release. Runs when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0),
# or by hand from the Actions tab.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # One draft release for the version; every platform then uploads into it.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { version } = require("./apps/tauri/package.json");
            const tag = context.ref.startsWith("refs/tags/") ? context.ref.replace("refs/tags/", "") : `v${version}`;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Roulette ${tag}`,
              body: "Download the installer for your system below.",
              draft: true,
            });
            core.setOutput("id", data.id);

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/tauri/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          # the universal macOS build needs both Apple targets
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: apps/tauri
        run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/tauri
          tauriScript: pnpm tauri
          releaseId: ${{ needs.create-release.outputs.id }}
          args: ${{ matrix.args }}
